<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    *{
      padding: 0;
      box-sizing: border-box;
      margin: 0;
    }
    body{
      background-color: black;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .parent{
      border-radius: 20px;
      padding: 30px;
    }
    div{
      background-color:  hsl(213, 19%, 18%) ;
      padding: 20px;
    }
    .circle{
      display: flex;
      justify-content: space-between;
    }
    .one{ 
      height: 20px;
      width: 10px;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      border-radius: 20px;
      background-color: hsl(218, 5%, 31%);
      color: white;
      opacity: 0.5;
    }
    .two{
      height: 20px;
      width: 10px;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      border-radius: 20px;
      background-color:   hsl(218, 5%, 31%);
      color: white;
      opacity: 0.5;
    }
    .three{ 
      height: 20px;
      width: 10px;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      border-radius: 20px;
      background-color:   hsl(218, 5%, 31%);
      color: white;
      opacity: 0.5;
    }
    .four{
      height: 20px;
      width: 10px;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      border-radius: 20px;
      background-color: white;
    }
    .five{
      height: 20px;
      width: 10px;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      border-radius: 20px;
      color: black;
      background-color:hsl(25, 97%, 53%);
    }
    button{
      width: 100%;
      padding: 10px;
      border-radius: 20px;
      border: none;
    }
    img{
      background-color:  hsl(218, 5%, 31%);
      padding: 5px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    h1{
      color: white;
    }
    .color{
      color: white;
    }
    @media screen and (max-width: 1000px) {
       button{
      width: 100%;
      padding: 10px;
      border-radius: 20px;
      border: none;
      background-color: hsl(25, 97%, 53%);
    }
    .five{
      height: 20px;
      width: 10px;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      border-radius: 20px;
      background-color:hsl(218, 5%, 31%);
      color: white;
      opacity: 0.5;
    }
    .four{
      opacity: 0.5;
      color: white;
      height: 20px;
      width: 10px;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      border-radius: 20px;
      background-color:hsl(218, 5%, 31%);
    }
    }
  </style>
</head>
<body>
  <div class="parent">
    <img src="images/icon-star.svg" alt="">
    <br>  
    <h1 class="how">How did we do ?</h1>
    <p class="color">Let us know how we did with your support <br>request.All feedback is appreciated to help us <br> improve our offering</p>
    <br>
    <div class="circle">
      <div class="one">
        <p>1</p>
      </div>
      <div class="two">
        <p>2</p>
      </div>
      <div class="three">
        <p>3</p>
      </div>
      <div class="four">
        <p>4</p>
      </div>
      <div class="five">
        <p>5</p>
      </div>
    </div>
    <button>submit</button>
  </div>
</body>
</html>
